<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dave's Live Finance Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eceff1; padding: 20px; color: #263238; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { text-align: center; font-size: 24px; margin-bottom: 5px; }
        .sync-status { text-align: center; font-size: 12px; color: #4caf50; margin-bottom: 20px; }
        .section { margin-bottom: 25px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; color: #546e7a; }
        input { width: 100%; padding: 10px; border: 1px solid #cfd8dc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .asset-list { font-size: 14px; background: #f9f9f9; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .result-box { background: #e8f5e9; padding: 15px; border-radius: 12px; margin-top: 20px; border: 2px solid #2e7d32; }
        .total-money { font-size: 32px; color: #1b5e20; font-weight: bold; text-align: center; }
        .status-msg { text-align: center; font-weight: bold; margin-top: 10px; color: #d32f2f; }
        .footer-info { font-size: 12px; color: #78909c; margin-top: 20px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 Dave's 理財儀表板</h1>
    <div id="syncTime" class="sync-status">數據同步中...</div>

    <div class="section">
        <label>📋 目前抓取到的資產項目</label>
        <div id="assetDisplay" class="asset-list">讀取資料庫中...</div>
    </div>

    <div class="section">
        <label>📱 預計換手機預算 (元)</label>
        <input type="number" id="phonePrice" value="25000" oninput="processData()">
    </div>

    <div class="section">
        <label>🍱 平均每日伙食費 (元)</label>
        <input type="number" id="dailyFood" value="280" oninput="processData()">
    </div>

    <div class="result-box">
        <div style="text-align: center; font-size: 14px;">✈️ 6 月底去新加坡前的預計可用餘額</div>
        <div class="total-money" id="finalBalance">$ 0</div>
        <div id="statusMessage" class="status-msg"></div>
    </div>

    <div class="footer-info">
        * 自動計算：(表格總額) + (3-6月結餘 $18,401 × 4) - (伙食費) - (手機)<br>
        * 固定扣除：房租 $4,800、月票 $999、訂閱 $500<br>
        * 數據來源：你的專屬 Google Sheets
    </div>
</div>

<script>
    const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRqqDj5W9MR89ruAyvHFScrr8Ft0I8x7zUxpE_xXcwIcOa0WRT34ZoR8-EHl2hvVQsqW4C-usYHkutd/pub?output=csv";
    let googleData = [];

    // 從 Google Sheets 抓取資料
    async function fetchData() {
        try {
            const response = await fetch(csvUrl);
            const data = await response.text();
            const rows = data.split('\n').slice(1); // 跳過標題列
            
            googleData = rows.map(row => {
                const cols = row.split(',');
                return { name: cols[0], amount: parseFloat(cols[1]) || 0 };
            });

            document.getElementById('syncTime').innerText = "● 數據已從雲端同步 (" + new Date().toLocaleTimeString() + ")";
            processData();
        } catch (error) {
            document.getElementById('syncTime').innerText = "❌ 同步失敗，請檢查表格發佈設定";
            console.error("Fetch error:", error);
        }
    }

    function processData() {
        let totalCurrentAssets = 0;
        let displayText = "";

        // 加總表格內所有資產
        googleData.forEach(item => {
            if (item.name) {
                totalCurrentAssets += item.amount;
                displayText += `${item.name}: $${item.amount.toLocaleString()}<br>`;
            }
        });

        document.getElementById('assetDisplay').innerHTML = displayText || "尚未設定資產項目";

        // 計算邏輯
        const phone = parseFloat(document.getElementById('phonePrice').value) || 0;
        const food = parseFloat(document.getElementById('dailyFood').value) || 0;
        
        // 3-6月固定結餘 (已扣房租月票訂閱) 為 18401/月
        const futureSavings = 18401 * 4; 
        const foodTotal = food * 140; // 估計剩餘天數
        
        // 最終可用流動資金
        const final = totalCurrentAssets + futureSavings - foodTotal - phone;

        document.getElementById('finalBalance').innerText = "$" + Math.round(final).toLocaleString();

        // 警示邏輯
        let msg = document.getElementById('statusMessage');
        if (final < 20000) {
            msg.innerText = "⚠️ 餘額偏低，建議下修手機預算！";
        } else {
            msg.innerText = "✅ 財務穩健，新加坡之旅準備出發！";
            msg.style.color = "#2e7d32";
        }
    }

    // 啟動抓取
    fetchData();
    // 每 5 分鐘自動刷新一次
    setInterval(fetchData, 300000);
</script>

</body>
</html>
