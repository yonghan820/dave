<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dave's Finance Dash</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eceff1; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { color: #263238; text-align: center; font-size: 24px; }
        .section { margin-bottom: 25px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; color: #546e7a; }
        input { width: 100%; padding: 10px; border: 1px solid #cfd8dc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .result-box { background: #e8f5e9; padding: 15px; border-radius: 12px; margin-top: 20px; }
        .total-money { font-size: 28px; color: #2e7d32; font-weight: bold; text-align: center; }
        .warning { color: #d32f2f; font-size: 14px; margin-top: 10px; text-align: center; }
        .btn { background: #2196f3; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 18px; margin-top: 10px; }
        .btn:hover { background: #1976d2; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 Dave's 預算動態計算器</h1>

    <div class="section">
        <label>📱 預計換手機預算 (元)</label>
        <input type="number" id="phonePrice" value="25000" oninput="calculate()">
    </div>

    <div class="section">
        <label>🍱 平均每日伙食費 (元)</label>
        <input type="number" id="dailyFood" value="280" oninput="calculate()">
    </div>

    <div class="result-box">
        <div>💰 到 6 月底預計剩餘流動資金</div>
        <div class="total-money" id="finalBalance">$ 0</div>
        <div id="statusMessage" class="warning"></div>
    </div>

    <p style="font-size: 12px; color: #999; text-align: center; margin-top: 20px;">
        *已自動計入：獎學金5k、補習費18k、紅包10.4k、每月結餘8.4k<br>
        *已扣除：給爸媽10k、房租與固定支出
    </p>
</div>

<script>
    function calculate() {
        const phone = parseFloat(document.getElementById('phonePrice').value) || 0;
        const food = parseFloat(document.getElementById('dailyFood').value) || 0;

        // 基礎結餘邏輯：
        // 目前流動 12100 - 2月大支出淨影響 4200 + 3-6月固定結餘(未扣伙食雜費) 18400*4 
        // + 獎學金 5000 + 補習費 18000 + 阿公紅包等 10400
        // 簡化計算 6月底不含伙食與手機的流動資產約為：106,500 左右
        let baseAssets = 106500; 
        
        // 扣除伙食費 (假設剩餘 140 天)
        let foodTotal = food * 140;
        
        // 最終計算
        let final = baseAssets - foodTotal - phone;
        
        document.getElementById('finalBalance').innerText = "$" + Math.round(final).toLocaleString();

        // 警示邏輯
        let msg = document.getElementById('statusMessage');
        if (final < 20000) {
            msg.innerText = "⚠️ 警告：餘額低於 2 萬，新加坡旅遊可能會縮衣節食喔！";
        } else if (phone > 35000) {
            msg.innerText = "😎 買這麼好？看來家教 A 跟 B 要多接幾堂了！";
        } else {
            msg.innerText = "✅ 財務狀況健康，可以安心出國！";
        }
    }
    // 初始執行一次
    calculate();
</script>

</body>
</html>
