<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dave's Realtime Finance</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1a73e8; }
        .sync-tag { text-align: center; font-size: 12px; color: #34a853; margin-bottom: 20px; }
        .item-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #f8f9fa; padding: 10px; border-radius: 10px; }
        .item-label { font-weight: bold; flex: 1; }
        input[type="number"] { width: 100px; padding: 5px; border: 1px solid #ddd; border-radius: 5px; text-align: right; }
        .save-btn { background: #1a73e8; color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .result-box { background: #e7f3ff; padding: 15px; border-radius: 10px; margin-top: 20px; text-align: center; }
        .total-amount { font-size: 28px; font-weight: bold; color: #0d47a1; }
        .footer { font-size: 11px; color: #777; margin-top: 20px; text-align: center; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <h1>💰 Dave 即時理財</h1>
    <div id="status" class="sync-tag">● 雲端同步中...</div>

    <div id="assetList">
        </div>

    <button class="save-btn" onclick="saveData()">💾 儲存並同步到雲端</button>

    <div class="result-box">
        <div style="font-size: 14px;">✈️ 6 月底預計可用流動資金</div>
        <div class="total-amount" id="finalBalance">$ 0</div>
    </div>

    <div class="footer">
        * 自動扣除：房租 $4,800、月票 $999、訂閱 $500<br>
        * 試算已含 3-6 月家教與生活費結餘<br>
        * 數據即時存儲於 Firebase Database
    </div>
</div>

<script>
    // 泳漢，這是你的專屬金鑰
    const firebaseConfig = {
        apiKey: "AIzaSyAwg3PU6EHKvdJ5x4rVHhDn2bptQHR86gg",
        authDomain: "dave-finance.firebaseapp.com",
        databaseURL: "https://dave-finance-default-rtdb.firebaseio.com",
        projectId: "dave-finance",
        storageBucket: "dave-finance.firebasestorage.app",
        messagingSenderId: "768359501585",
        appId: "1:768359501585:web:9759bee89077e8060b86b0"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("assets");

    const assetNames = ["現金網銀", "股市資產", "運彩帳戶", "阿公紅包", "補習費退還"];
    
    // 初始化清單
    const listDiv = document.getElementById('assetList');
    assetNames.forEach(name => {
        listDiv.innerHTML += `
            <div class="item-row">
                <span class="item-label">${name}</span>
                <input type="number" id="val_${name}" value="0" oninput="calculate()">
            </div>
        `;
    });

    // 從資料庫讀取
    db.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            assetNames.forEach(name => {
                if (data[name] !== undefined) {
                    document.getElementById(`val_${name}`).value = data[name];
                }
            });
            calculate();
            document.getElementById('status').innerText = "● 數據已與雲端同步 (" + new Date().toLocaleTimeString() + ")";
        }
    });

    function calculate() {
        let currentTotal = 0;
        assetNames.forEach(name => {
            currentTotal += parseFloat(document.getElementById(`val_${name}`).value) || 0;
        });

        // 財務邏輯：每月結餘 18401 * 4個月 - 伙食費 (假設 280*140天)
        const futureSavings = 18401 * 4;
        const foodTotal = 280 * 140;
        const final = currentTotal + futureSavings - foodTotal;

        document.getElementById('finalBalance').innerText = "$" + Math.round(final).toLocaleString();
    }

    function saveData() {
        const dataToSave = {};
        assetNames.forEach(name => {
            dataToSave[name] = parseFloat(document.getElementById(`val_${name}`).value) || 0;
        });
        db.set(dataToSave).then(() => {
            alert("✅ 雲端存檔成功！你的 iPad 和手機看到的一樣了。");
        });
    }
</script>

</body>
</html>
